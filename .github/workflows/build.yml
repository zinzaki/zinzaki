name: Build profile

# Regenerates profile.svg (and refreshes the README cache token) whenever the
# source changes. Triggered only by edits to config.yml / generate.py; the
# workflow's own commit carries [skip ci] so it does not re-trigger itself.

on:
  push:
    branches: [main]
    paths:
      - config.yml
      - generate.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml -q

      - name: Generate
        run: python3 generate.py && python3 test_generate.py && python3 bump_cache.py

      - name: Commit regenerated SVGs
        run: |
          # Commit as github-actions[bot], never the owner — automation must not
          # touch anyone's contribution graph.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg README.md
          git diff --cached --quiet && { echo "nothing to do"; exit 0; }
          git commit -m "build: rebuild profile [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
